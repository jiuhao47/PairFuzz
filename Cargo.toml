[package]
name = "diffray"
version = "0.1.0"
authors = ["Junyan Jiang <jiangjunyan20040728@gmail.com>"]
edition = "2021"
default-run = "diffray"

[features]
multimap = []
# buggy

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3
debug = true

[build-dependencies]
anyhow = "1.0.89"
bindgen = "0.71.1"
cc = "=1.2.7"      # fix me later

[dependencies]
libafl = { path = "./LibAFL/crates/libafl" }
libafl_bolts = { path = "./LibAFL/crates/libafl_bolts" }
libafl_targets = { path = "./LibAFL/crates/libafl_targets", features = [
    "sancov_pcguard_hitcounts",
    "libfuzzer",
    "sancov_cmplog",
    "pointer_maps",
] }
log = { version = "0.4.22", features = ["release_max_level_info"] }
mimalloc = { version = "0.1.43", default-features = false }
clap = { version = "4.5", features = ["derive"] }

libafl_cc = { path = "./LibAFL/crates/libafl_cc" }

[[bin]]
name = "diffray"
path = "src/main.rs"

[[bin]]
name = "libafl_cc"
path = "src/bin/libafl_cc.rs"

[[bin]]

name = "libafl_cxx"
path = "src/bin/libafl_cxx.rs"
